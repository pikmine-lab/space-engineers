  <AutoUpdateSteamBranch>public</AutoUpdateSteamBranch>
  <AutoUpdateBranchPassword />
  <IgnoreLastSession>false</IgnoreLastSession>
  <!-- The hand-composed system, laid down by the entrypoint from the image.
       Relative to the server root, which is where Torch is started from. Point
       this back at ./Content/CustomWorlds/Star System to fall back on Keen's
       scenario. -->
