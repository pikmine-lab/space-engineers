    <EnableShareInertiaTensor>false</EnableShareInertiaTensor>
    <EnableUnsafePistonImpulses>false</EnableUnsafePistonImpulses>
    <EnableUnsafeRotorTorques>false</EnableUnsafeRotorTorques>
    <EnableRadiation>true</EnableRadiation>
    <!-- Multiplier on radiation gained from sun exposure. Zero, the shipped
         default of every vanilla preset, means solar radiation does not exist,
         which makes each planet's SolarRadiationProtectionFactor meaningless.
         One is the neutral value of a multiplier and the starting point here,
         not a measured one: it turns the per-planet gradient on, so a well
         shielded world stays livable (EarthLike is 1.8) while a bare one turns
         lethal (Europa is 0, and emits 0.6 per second of its own). Raise or
         lower it after playing, it is the only way to calibrate it. -->
    <SolarRadiationIntensity>1</SolarRadiationIntensity>
    <ResetForageableItems>true</ResetForageableItems>
    <ResetForageableItemsTimeM>30</ResetForageableItemsTimeM>
    <ResetForageableItemsDistance>3000</ResetForageableItemsDistance>
