<?xml version="1.0" encoding="utf-8"?>
<!--
  Starting Torch configuration, seeded into the volume only when absent. Torch
  rewrites this file as it runs, so these comments live in the repository only.

  Updates are off on purpose: the Torch build is pinned by the image, and a
  server that fetches a different build than the one that was tested is a
  server nobody can reproduce. Moving to a newer build means bumping
  TORCH_BUILD in the Dockerfile and rebuilding.
-->
<TorchConfig xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <InstanceName>Pikmine</InstanceName>
  <InstancePath>./instance</InstancePath>
  <Autostart>true</Autostart>
  <!-- Let the crash surface as a container restart instead of being absorbed
       here: Dokploy then shows something happened. Worth revisiting once the
       server is known to be stable. -->
  <RestartOnCrash>false</RestartOnCrash>
  <RestartOnGameUpdate>false</RestartOnGameUpdate>
  <GameUpdateRestartDelayMins>5</GameUpdateRestartDelayMins>
  <NoGui>true</NoGui>
  <GetTorchUpdates>false</GetTorchUpdates>
  <GetPluginUpdates>false</GetPluginUpdates>
  <BypassIsReloadableFlag>false</BypassIsReloadableFlag>
  <TickTimeout>60</TickTimeout>
  <Plugins />
  <LocalPlugins>false</LocalPlugins>
  <DisconnectOnRestart>false</DisconnectOnRestart>
  <ChatName>Server</ChatName>
  <ChatColor>Red</ChatColor>
  <EnableWhitelist>false</EnableWhitelist>
  <Whitelist />
  <WindowWidth>980</WindowWidth>
  <WindowHeight>588</WindowHeight>
  <FontSize>16</FontSize>
  <UgcServiceType>Steam</UgcServiceType>
  <BranchName>master</BranchName>
  <LastUsedTheme>Torch Theme</LastUsedTheme>
  <IndependentConsole>true</IndependentConsole>
  <EnableAsserts>false</EnableAsserts>
  <SendLogsToKeen>false</SendLogsToKeen>
  <DeleteMiniDumps>true</DeleteMiniDumps>
</TorchConfig>
