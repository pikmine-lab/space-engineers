# Builds the server image and publishes it to GHCR.
#
# Nothing here deploys. A build writes the new tag into provision/src/specs.ts
# and commits it, which only records that a candidate exists: pulling that
# commit and running the provisioner is a separate, deliberate act.
#
# The build takes a while, most of it installing .NET Framework 4.8 into the
# Wine prefix. Paths are filtered so a documentation change does not spend
# twenty minutes rebuilding an identical image.

name: build-image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - server/config/**
      - server/world-seed/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/space-engineers

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the last step commits the new tag back to main.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # sha-<short> is the tag meant to be deployed: it is immutable and
          # names exactly one build. `latest` is a convenience for pulling by
          # hand, never what the provisioner points at.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # The whole repository: the Dockerfile copies server/config/ in as the
          # seed configuration, and server/world-seed/ as the premade world.
          context: .
          file: image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Writing the tag by hand was the one manual step left in the loop, and the
      # one that made every build leave an uncommitted diff behind.
      #
      # This commit does not retrigger the workflow, twice over: provision/ is
      # not in the paths filter above, and pushes made with GITHUB_TOKEN do not
      # start workflow runs at all.
      - name: Write the deployable tag into the spec
        # Only from main. A build from anywhere else is not a deployment
        # candidate, which is also why `latest` is restricted to the default
        # branch above.
        if: github.ref == 'refs/heads/main'
        run: |
          # Read the tag off the metadata action rather than recomputing it:
          # `git rev-parse --short` widens the abbreviation when it has to,
          # while type=sha always truncates to the same 7 characters. The
          # `version` output is no use here, it resolves to `latest`, whose
          # priority outranks the sha tag.
          TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed -n 's/^.*:\(sha-.*\)$/\1/p' | head -n1)
          if [ -z "$TAG" ]; then
            echo "::error::no sha- tag in the metadata output"
            exit 1
          fi

          # main may have moved during the build, which takes about twenty
          # minutes. Checkout left us on the triggering commit, which is what the
          # image was built from, but not what we can push onto.
          git fetch origin main
          git checkout -B main origin/main

          sed -i "s/imageTag: \"[^\"]*\"/imageTag: \"$TAG\"/" provision/src/specs.ts
          # A silent no-op here would read as "nothing to deploy" on the next
          # run, so a spec that no longer carries the field is an error.
          if ! grep -q "imageTag: \"$TAG\"" provision/src/specs.ts; then
            echo "::error::imageTag not found in provision/src/specs.ts"
            exit 1
          fi

          if git diff --quiet -- provision/src/specs.ts; then
            echo "Spec already at \`$TAG\`, nothing to commit." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provision/src/specs.ts
          git commit -m "chore(provision): deploy $TAG"
          git push origin main

          echo "Candidate written to the spec: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo '```sh' >> $GITHUB_STEP_SUMMARY
          echo "git pull && cd provision && nr provision" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
