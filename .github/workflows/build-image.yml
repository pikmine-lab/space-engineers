# Builds the server image and publishes it to GHCR.
#
# Nothing here deploys. The provisioner decides which tag runs, so a build is
# only ever "a new candidate exists": bumping SE_IMAGE_TAG in specs.ts and
# running the provisioner is a separate, deliberate act.
#
# The build takes a while, most of it installing .NET Framework 4.8 into the
# Wine prefix. Paths are filtered so a documentation change does not spend
# twenty minutes rebuilding an identical image.

name: build-image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - server/config/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/space-engineers

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # sha-<short> is the tag meant to be deployed: it is immutable and
          # names exactly one build. `latest` is a convenience for pulling by
          # hand, never what the provisioner points at.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # The whole repository: the Dockerfile copies server/config/ in as
          # the seed configuration.
          context: .
          file: image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag to deploy
        run: |
          echo "Set SE_IMAGE_TAG in provision/src/specs.ts to:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "sha-$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
